; Cool Watch OS firmware for the CircuitMess Clockstar 2.0 (ESP32-S3)
[platformio]
default_envs = clockstar

[env:clockstar]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@1.2.7
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall -Wno-unused-parameter

; SQFMI Watchy (ESP32-PICO-D4, 200x200 e-paper). Pick the env matching the
; revision printed on your board; v2.0 is the most common kit.
[watchy_base]
platform = espressif32@6.9.0
board = pico32
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
	lovyan03/LovyanGFX@1.2.7
	zinggjm/GxEPD2@1.6.5
	lewisxhe/SensorLib@0.2.4
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall -Wno-unused-parameter

[env:watchy]
extends = watchy_base
build_flags = -DCOOLWATCH_WATCHY -DCOOLWATCH_WATCHY_REV=20

[env:watchy-v15]
extends = watchy_base
build_flags = -DCOOLWATCH_WATCHY -DCOOLWATCH_WATCHY_REV=15

[env:watchy-v10]
extends = watchy_base
build_flags = -DCOOLWATCH_WATCHY -DCOOLWATCH_WATCHY_REV=10
